# Supabase local config. `supabase start` boots Postgres + Auth + Storage in
# Docker. NOTE: Docker is required for the local stack and is NOT available in
# this CI sandbox — tests therefore run against in-memory fakes, not a live DB.
project_id = "hoku"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
# Magic-link / passwordless is the only auth method per build prompt §2.

[storage]
enabled = true
file_size_limit = "50MiB"
